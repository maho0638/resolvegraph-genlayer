name: CI

on:
  push:
  pull_request:

concurrency:
  group: resolvegraph-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: pytest tests/direct -v
      - name: GenVM lint contracts
        run: |
          genvm-lint check contracts/resolve_graph.py
          genvm-lint check contracts/resolve_graph_v2.py
          genvm-lint check contracts/evidence_registry.py
          genvm-lint check contracts/resolve_graph_v3.py
          genvm-lint check contracts/cross_chain_settlement.py
      - name: Integration test syntax
        run: |
          python -m py_compile \
            tests/integration/test_resolvegraph_studionet.py \
            tests/integration/test_resolvegraph_studionet_resume.py \
            tests/integration/test_resolvegraph_studionet_inspect.py \
            tests/integration/test_resolvegraph_v2_recipes_studionet.py \
            tests/integration/test_resolvegraph_evidence_registry_studionet.py \
            tests/integration/test_resolvegraph_v3_appeals_studionet.py \
            tests/integration/test_cross_chain_settlement_studionet.py
      - name: SDK build and tests
        working-directory: sdk
        run: |
          npm install
          npm test
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
