name: ResolveGraph Source Adapters Proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/resolvegraph-source-adapters-proof.trigger"

permissions:
  contents: read
  statuses: read

jobs:
  live-source-adapters-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build production frontend locally
        working-directory: frontend
        env:
          NEXT_PUBLIC_RESOLVEGRAPH_CONTRACT_ADDRESS: "0x5E7e96dCfB5dF57881CFfBFc5b597f7b83c4A754"
          NEXT_PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
        run: |
          npm install
          npm run build
      - name: Start production frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_RESOLVEGRAPH_CONTRACT_ADDRESS: "0x5E7e96dCfB5dF57881CFfBFc5b597f7b83c4A754"
          NEXT_PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
        run: |
          npm run start -- -p 3100 > /tmp/resolvegraph-next.log 2>&1 &
          echo $! > /tmp/resolvegraph-next.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/adapters >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/resolvegraph-next.log
          exit 1
      - name: Verify GitHub commit adapter against this repository
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:3100
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source-adapters
          commit_url="https://github.com/${{ github.repository }}/commit/$EXPECTED_SHA"
          payload="$(curl -fsSL --get --data-urlencode "url=$commit_url" "$BASE_URL/api/adapters/github")"
          printf '%s' "$payload" > artifacts/source-adapters/github-commit.json
          PAYLOAD="$payload" EXPECTED="$EXPECTED_SHA" python - <<'PY'
          import json, os, re
          data = json.loads(os.environ["PAYLOAD"])
          assert data["sourceType"] == "GITHUB_COMMIT"
          assert data["immutableRef"] == os.environ["EXPECTED"].lower()
          assert re.fullmatch(r"[a-f0-9]{64}", data["adapterDigest"])
          print("github commit adapter ok", data["repository"], data["author"])
          PY

      - name: Verify GitHub pull-request adapter
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          payload="$(curl -fsSL --get --data-urlencode "url=https://github.com/vercel/next.js/pull/1" "$BASE_URL/api/adapters/github")"
          printf '%s' "$payload" > artifacts/source-adapters/github-pr.json
          PAYLOAD="$payload" python - <<'PY'
          import json, os, re
          data = json.loads(os.environ["PAYLOAD"])
          assert data["sourceType"] == "GITHUB_PR"
          assert data["repository"].lower() == "vercel/next.js"
          assert data["pullNumber"] == 1
          assert re.fullmatch(r"[a-f0-9]{40}", data["headSha"])
          assert re.fullmatch(r"[a-f0-9]{64}", data["adapterDigest"])
          print("github PR adapter ok", data["state"], data["author"])
          PY

      - name: Verify GitHub Actions adapter
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          run_url="https://github.com/maho0638/resolvegraph-genlayer/actions/runs/36598129489"
          payload="$(curl -fsSL --get --data-urlencode "url=$run_url" "$BASE_URL/api/adapters/github")"
          printf '%s' "$payload" > artifacts/source-adapters/github-ci.json
          PAYLOAD="$payload" python - <<'PY'
          import json, os, re
          data = json.loads(os.environ["PAYLOAD"])
          assert data["sourceType"] == "GITHUB_CI"
          assert data["runId"] == 36598129489
          assert data["status"] == "completed"
          assert data["conclusion"] == "success"
          assert re.fullmatch(r"[a-f0-9]{40}", data["headSha"])
          print("github CI adapter ok")
          PY

      - name: Verify Ethereum transaction adapter
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          tx="0xd737e9c0f1c5ac269ba6227b8cda287dd946de1b3af61ac4761b7e28fd5b7498"
          http_code="$(curl -sS -o artifacts/source-adapters/ethereum-tx.json -w "%{http_code}" --get \
            --data-urlencode "chainId=1" \
            --data-urlencode "txHash=$tx" \
            "$BASE_URL/api/adapters/ethereum")"
          cat artifacts/source-adapters/ethereum-tx.json
          test "$http_code" = "200"
          payload="$(cat artifacts/source-adapters/ethereum-tx.json)"
          PAYLOAD="$payload" TX="$tx" python - <<'PY'
          import json, os, re
          data = json.loads(os.environ["PAYLOAD"])
          assert data["sourceType"] == "ETHEREUM_TX"
          assert data["chainId"] == 1
          assert data["txHash"] == os.environ["TX"]
          assert data["status"] == "SUCCESS"
          assert data["blockNumber"] > 0
          assert data["confirmations"] > 0
          assert re.fullmatch(r"[a-f0-9]{64}", data["adapterDigest"])
          print("ethereum adapter ok", data["blockNumber"], data["confirmations"])
          PY

      - name: Verify artifact adapter
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          payload="$(curl -fsSL --get --data-urlencode "url=https://example.com" "$BASE_URL/api/adapters/artifact")"
          printf '%s' "$payload" > artifacts/source-adapters/artifact.json
          PAYLOAD="$payload" python - <<'PY'
          import json, os, re
          data = json.loads(os.environ["PAYLOAD"])
          assert data["sourceType"] == "ARTIFACT"
          assert data["byteLength"] > 0
          assert re.fullmatch(r"[a-f0-9]{64}", data["contentHash"])
          assert re.fullmatch(r"[a-f0-9]{64}", data["adapterDigest"])
          print("artifact adapter ok", data["contentType"], data["byteLength"])
          PY

      - name: Replay captured adapter digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for path in sorted(Path("artifacts/source-adapters").glob("*.json")):
              data = json.loads(path.read_text())
              expected = data.pop("adapterDigest")
              payload = json.dumps(data, separators=(",", ":"), ensure_ascii=False)
              actual = hashlib.sha256(payload.encode()).hexdigest()
              assert actual == expected, (path.name, actual, expected)
              print("replay ok", path.name, expected)
          PY

      - name: Upload source adapter proof fixtures
        uses: actions/upload-artifact@v4
        with:
          name: resolvegraph-source-adapters-proof
          path: artifacts/source-adapters/
