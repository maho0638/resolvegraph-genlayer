name: ResolveGraph Typed Evidence Registry Proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/resolvegraph-evidence-registry-proof.trigger"

jobs:
  live-evidence-registry-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Install source verifier dependency
        working-directory: scripts
        run: npm install
      - name: Lint evidence registry contract
        run: genvm-lint check contracts/evidence_registry.py
      - name: Pin evidence registry source hash
        run: sha256sum contracts/evidence_registry.py
      - name: Run typed evidence registry live proof
        run: gltest tests/integration/test_resolvegraph_evidence_registry_studionet.py -v -s --network studionet
      - name: Verify deployed evidence registry source equals repository source
        run: |
          CONTRACT_ADDRESS="$(cat artifacts/resolvegraph-evidence-registry-address.txt)" \
          CONTRACT_SOURCE_PATH="contracts/evidence_registry.py" \
          node scripts/verify-deployed-source.mjs
      - name: Upload evidence registry proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resolvegraph-evidence-registry-proof
          path: artifacts/
