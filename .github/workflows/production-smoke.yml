name: Production Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://resolvegraph-genlayer.vercel.app
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Wait for matching Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Vercel status on $EXPECTED_SHA"
          for attempt in $(seq 1 40); do
            payload="$(curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/${{ github.repository }}/commits/$EXPECTED_SHA/status")"
            state="$(STATUS_JSON="$payload" python - <<'PY'
          import json, os
          data = json.loads(os.environ["STATUS_JSON"])
          statuses = [x for x in data.get("statuses", []) if x.get("context") == "Vercel"]
          print(statuses[0].get("state", "missing") if statuses else "missing")
          PY
          )"
            echo "attempt=$attempt vercel=$state"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Vercel deployment failed"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel"
          exit 1

      - name: Verify public pages and assets
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            path="$1"
            marker="$2"
            echo "GET $path"
            body="$(curl -fsSL --retry 3 --retry-delay 3 "$BASE_URL$path")"
            grep -Fq "$marker" <<<"$body"
          }

          check_page "/" "ResolveGraph"
          check_page "/explorer" "Public Explorer"
          check_page "/operate" "Operator Console"
          check_page "/recipes" "Workflow Recipes"
          check_page "/participants" "Participant Ledger"
          check_page "/provenance" "Signed Provenance"
          check_page "/evidence?workflow=rg-live-success-v1&step=source-check" "Typed Evidence Archive"
          check_page "/developers" "Developer Surface"
          check_page "/proof" "Reviewer Proof"
          check_page "/workflows/rg-live-success-v1" "Workflow Case Room"

          content_type="$(curl -fsSI "$BASE_URL/resolvegraph-logo.webp" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}')"
          echo "logo content-type=$content_type"
          [[ "$content_type" == image/webp* ]]

      - name: Verify production API and canonical workflows
        shell: bash
        run: |
          set -euo pipefail

          health="$(curl -fsSL --retry 3 "$BASE_URL/api/health")"
          HEALTH_JSON="$health" EXPECTED="$EXPECTED_SHA" python - <<'PY'
          import json, os
          data = json.loads(os.environ["HEALTH_JSON"])
          expected = os.environ["EXPECTED"]
          assert data["service"] == "ResolveGraph"
          assert data["network"] == "studionet"
          assert data["contractConfigured"] is True
          assert data["rpcConfigured"] is True
          assert data["production"] is True
          commit = data.get("deploymentCommit")
          if commit:
              assert commit == expected, (commit, expected)
          print("health ok", data.get("contract"), commit)
          PY

          workflows="$(curl -fsSL --retry 3 "$BASE_URL/api/workflows")"
          WORKFLOWS_JSON="$workflows" python - <<'PY'
          import json, os
          data = json.loads(os.environ["WORKFLOWS_JSON"])
          ids = {str(x.get("id")) for x in data.get("workflows", [])}
          assert "rg-live-success-v1" in ids, ids
          assert "rg-live-failure-v1" in ids, ids
          print("workflow count", data.get("count"), "canonical ids present")
          PY

          success="$(curl -fsSL --retry 3 "$BASE_URL/api/workflow?id=rg-live-success-v1")"
          SUCCESS_JSON="$success" python - <<'PY'
          import json, os
          data = json.loads(os.environ["SUCCESS_JSON"])
          assert data["workflow"]["status"] == "COMPLETED"
          assert len(data.get("steps", [])) == 2
          print("success workflow ok")
          PY

          failure="$(curl -fsSL --retry 3 "$BASE_URL/api/workflow?id=rg-live-failure-v1")"
          FAILURE_JSON="$failure" python - <<'PY'
          import json, os
          data = json.loads(os.environ["FAILURE_JSON"])
          wf = data["workflow"]
          assert wf["status"] == "FAILED_SETTLED"
          assert wf["fault_class"] == "EXTERNAL"
          print("failure workflow ok")
          PY

          receipt="$(curl -fsSL --retry 3 "$BASE_URL/api/receipt?workflow=rg-live-success-v1")"
          RECEIPT_JSON="$receipt" python - <<'PY'
          import json, os
          data = json.loads(os.environ["RECEIPT_JSON"])
          assert data["schema"] == "resolvegraph-receipt-v1"
          assert data["outcome"] == "COMPLETED"
          print("receipt ok")
          PY

          step="$(curl -fsSL --retry 3 "$BASE_URL/api/step?workflow=rg-live-success-v1&step=source-check")"
          STEP_JSON="$step" python - <<'PY'
          import json, os
          data = json.loads(os.environ["STEP_JSON"])
          assert data["schema"] == "resolvegraph-step-v1"
          assert data["step"]["status"] == "PAID"
          print("step api ok")
          PY

          participant="$(curl -fsSL --retry 3 "$BASE_URL/api/participant?address=0xAEF841f024cC86d952f27486480b1109244676f3")"
          PARTICIPANT_JSON="$participant" python - <<'PY'
          import json, os
          data = json.loads(os.environ["PARTICIPANT_JSON"])
          assert data["schema"] == "resolvegraph-participant-v1"
          assert int(data["stats"]["steps_accepted"]) >= 1
          print("participant api ok")
          PY

          recipes="$(curl -fsSL --retry 3 "$BASE_URL/api/recipes")"
          RECIPES_JSON="$recipes" python - <<'PY'
          import json, os
          data = json.loads(os.environ["RECIPES_JSON"])
          assert data["schema"] == "resolvegraph-recipes-v2"
          assert data["network"] == "studionet"
          assert data["policyVersion"] == "RG_V2_IMMUTABLE_RECIPES"
          assert data["count"] == 3
          hashes = {str(x) for x in data.get("hashes", [])}
          assert "200c7cf2a38dd134d815c493795a01c65610648cf701334366eb3ae46acd1e04" in hashes
          assert "91602e091cce5964d300b3880bee3e5a7862fa4b17d1bac71ba2b3229e4a638f" in hashes
          assert "9dca5c6c8790600ca6629e4a47eebb3f71374237f1f29732c45c7ef7512942f2" in hashes
          assert data["sourceMatch"] is True
          print("V2 live recipe registry api ok")
          PY

          evidence="$(curl -fsSL --retry 3 "$BASE_URL/api/evidence?workflow=rg-live-success-v1&step=source-check")"
          EVIDENCE_JSON="$evidence" python - <<'PY'
          import json, os, re
          data = json.loads(os.environ["EVIDENCE_JSON"])
          assert data["schema"] == "resolvegraph-evidence-manifest-v2"
          assert data["stepId"] == "source-check"
          assert data["decision"]["status"] == "PAID"
          assert data["evidenceVersioning"]["archivedRecordCount"] == 3
          assert data["evidenceVersioning"]["initialArchiveDigest"]
          assert data["evidenceVersioning"]["finalArchiveDigest"]
          assert data["evidenceVersioning"]["initialArchiveDigest"] != data["evidenceVersioning"]["finalArchiveDigest"]
          assert re.fullmatch(r"[a-f0-9]{64}", data["manifestDigest"])
          print("evidence manifest v2 ok")
          PY

          archive="$(curl -fsSL --retry 3 "$BASE_URL/api/evidence/archive?workflow=rg-live-success-v1&step=source-check")"
          ARCHIVE_JSON="$archive" python - <<'PY'
          import json, os, re
          data = json.loads(os.environ["ARCHIVE_JSON"])
          assert data["schema"] == "resolvegraph-evidence-archive-v1"
          assert data["archivedCount"] == 3
          assert data["registryContract"].lower() == "0xb5b0dd5e454590fcb4fcefd85b11d16774552390"
          roles = {(x["decisionRound"], x["role"]) for x in data["records"]}
          assert (1, "PRIMARY") in roles
          assert (1, "SUPPORT") in roles
          assert (2, "CHALLENGE") in roles
          for item in data["records"]:
              assert re.fullmatch(r"[a-f0-9]{64}", item["digest"])
              assert re.fullmatch(r"[a-f0-9]{64}", item["record"]["content_hash"])
          print("immutable evidence archive ok")
          PY

          capture_status="$(curl -sS -o /tmp/evidence-capture.json -w "%{http_code}" \
            -X POST \
            -H "content-type: application/json" \
            -d '{}' \
            "$BASE_URL/api/evidence/capture")"
          test "$capture_status" = "400"
          grep -Fq "workflowId and stepId are required" /tmp/evidence-capture.json
          echo "evidence capture validation endpoint ok"

          provenance_status="$(curl -sS -o /tmp/provenance.json -w "%{http_code}" \
            -X POST \
            -H "content-type: application/json" \
            -d '{}' \
            "$BASE_URL/api/provenance/github")"
          test "$provenance_status" = "400"
          grep -Fq "gistUrl and a 65-byte wallet signature are required" /tmp/provenance.json
          echo "provenance validation endpoint ok"

          verification="$(curl -fsSL --retry 3 "$BASE_URL/verification-status.json")"
          VERIFY_JSON="$verification" python - <<'PY'
          import json, os
          data = json.loads(os.environ["VERIFY_JSON"])
          assert data["canonical_studionet"]["status"] == "SUCCESS"
          assert data["canonical_studionet"]["source_match"] is True
          print("verification snapshot ok")
          PY
